appId: com.wespr.app
productName: WeSpR
copyright: Copyright © 2026 WeSpR Contributors

directories:
  output: release

mac:
  category: public.app-category.productivity
  target:
    - target: dmg
      arch: [universal]
    - target: zip
      arch: [universal]
  icon: resources/icon.icns
  x64ArchFiles: Contents/Resources/binaries/**
  extendInfo:
    NSMicrophoneUsageDescription: WeSpR a besoin du micro pour enregistrer votre voix. L'audio reste sur votre Mac.
    NSCameraUsageDescription: WeSpR n'utilise pas la caméra.

dmg:
  title: WeSpR
  background: resources/dmg-background.png
  window: { width: 600, height: 380 }
  contents:
    - { x: 160, y: 170, type: file }
    - { x: 440, y: 170, type: link, path: /Applications }

extraResources:
  - from: resources/binaries/
    to: binaries/
    filter: ["**/*"]

files:
  - dist/**
  - "!dist/mac-universal*/**"
  - "!dist/builder-debug.yml"
  - dist-electron/**
  - node_modules/**
  - package.json

asar: true
asarUnpack:
  - resources/binaries/**
